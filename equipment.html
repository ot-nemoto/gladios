<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="同じ女性剣闘士に6種類の兜パーツを重ねて着脱できる、小さな装備室。元の画像切替方式と比較できます。">
<title>小さな装備室 — 装備を着脱する</title>
</head>
<body>
<noscript>装備の着脱にはJavaScriptを有効にしてください。</noscript>
<main>
  <header><div><p class="eyebrow">CHIBI WARDROBE</p><h1>小さな装備室</h1></div><span>女性剣闘士 / 兜の着脱</span></header>
  <nav class="page-switch" aria-label="着せ替え方式を比較"><a href="./">画像を切り替える</a><a href="./equipment.html" aria-current="page">装備を着脱する</a></nav>
  <div class="layout">
    <section class="preview" aria-label="装備の着脱プレビュー">
      <div class="preview-label"><span>APPEARANCE</span><span id="variant-label">銀・青緑の兜</span></div>
      <div class="arch" aria-hidden="true"></div>
      <canvas id="character" width="640" height="900" role="img" aria-label="装備を読み込んでいます"></canvas>
      <div class="preview-bottom"><p id="status" role="status" aria-live="polite">装備を読み込んでいます…</p><span id="counter">— / 07</span></div>
    </section>
    <section class="wardrobe" aria-label="兜の選択">
      <p class="eyebrow">CHOOSE YOUR HELMET</p><h2>どの兜にする？</h2><p class="intro">同じ人物のまま、兜を着けたり外したりできます。</p>
      <div class="group-title"><h3>頭の装備</h3><span id="style-count">7 STYLES</span></div>
      <div id="equipment-options" class="options"></div>
      <div class="selected"><p>現在の装い</p><h3 id="selected-name">銀・青緑の兜</h3><div id="selected-detail">装備を読み込んでいます…</div></div>
      <div class="actions"><button id="remove" type="button">兜を外す</button><a id="download" aria-disabled="true" download>この姿をPNGで保存</a></div>
      <p class="note">人物と兜を重ねた見本です。装備時は低いポニーテールに変わり、外すと元の髪型に戻ります。</p>
    </section>
  </div>
  <footer><span>GLADIOS / CHIBI APPEARANCE STUDY</span><span>装備パーツの着脱見本</span></footer>
</main>
<script type="module" src="/src/equipment.ts"></script>
</body>
</html>
