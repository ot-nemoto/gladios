<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="剣闘士のキャラクターと背景を組み合わせ、512×512のPNGとして保存できるページです。">
<title>小さな装備室 — キャラと背景の組み合わせ</title>
</head>
<body>
<noscript>組み合わせの表示と保存にはJavaScriptを有効にしてください。</noscript>
<main>
  <header><div><p class="eyebrow">SCENE COMPOSER</p><h1>小さな装備室</h1></div><span>キャラと背景を組み合わせる</span></header>
  <nav class="page-switch" aria-label="装備室のページ"><a href="./">画像を切り替える</a><a href="./equipment.html">装備を着脱する</a><a href="./helmet-fit.html">顔と兜を比較する</a><a href="./scene.html" aria-current="page">背景と組み合わせる</a></nav>
  <div class="scene-layout">
    <section class="scene-preview" aria-label="組み合わせのプレビュー">
      <canvas id="scene" width="512" height="512" role="img" aria-label="キャラと背景の組み合わせ" aria-busy="true"></canvas>
      <p id="status" role="status" aria-live="polite">画像を読み込んでいます…</p>
    </section>
    <section class="scene-controls" aria-label="組み合わせの選択">
      <fieldset>
        <legend>キャラ</legend>
        <div class="scene-options" id="characters"></div>
      </fieldset>
      <fieldset>
        <legend>背景</legend>
        <div class="scene-options" id="backgrounds"></div>
      </fieldset>
      <div class="scene-actions"><button id="download" type="button" disabled>PNGで保存 ↓</button><span>512 × 512 px</span></div>
    </section>
  </div>
  <footer><span>GLADIOS / SCENE COMPOSER</span><span>キャラと背景の合成見本</span></footer>
</main>
<script type="module" src="/src/scene.ts"></script>
</body>
</html>
