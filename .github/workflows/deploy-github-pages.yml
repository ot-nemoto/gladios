name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # プロジェクトページは https://<owner>.github.io/<repo>/ 配下で配信されるため、
      # アセットの参照先をリポジトリ名の下にする（ローカルの dev / build には影響しない）
      # github コンテキストは env 経由で渡す（run への直接展開はコマンド注入になりうる）
      - name: Build static site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base="/${REPO_NAME}/"

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
