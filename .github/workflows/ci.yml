# PR と develop への push のたびに、型チェックとビルドを走らせる
# （Biome の lint・整形チェックは #13 で Biome を導入してから追加する）
name: CI

on:
  pull_request:
  push:
    branches: [develop]

# 型検査とビルドだけなので、トークンの権限は読み取りだけにする
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: ビルド
        run: npm run build
