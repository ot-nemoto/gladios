version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    target-branch: develop

  # ワークフローで使う actions の版もここで上げる（gitleaks は対象外なので secret-scan.yml で手動更新）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    groups:
      github-actions:
        patterns:
          - "*"
