<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小さな装備室 — 兜の着せ替え</title>

</head>
<body>
<noscript>着せ替えの切替にはJavaScriptを有効にしてください。</noscript>
<main>
  <header><div><p class="eyebrow">CHIBI WARDROBE</p><h1>小さな装備室</h1></div><span>女性剣闘士 / 兜の着せ替え</span></header>
  <div class="layout">
    <section class="preview" aria-label="着せ替えのプレビュー">
      <div class="preview-label"><span>APPEARANCE</span><span id="variant-label">銀・青緑の兜</span></div>
      <div class="arch" aria-hidden="true"></div>
      <canvas id="character" width="640" height="900" role="img" aria-label="銀・青緑の兜を着けた低頭身の女性剣闘士"></canvas>
      <div class="preview-bottom"><p id="status" role="status" aria-live="polite">立ち絵を読み込んでいます…</p><span id="counter">02 / 03</span></div>
    </section>
    <section class="wardrobe" aria-label="兜の選択">
      <p class="eyebrow">CHOOSE YOUR HELMET</p><h2>どの兜にする？</h2><p class="intro">気に入った立ち絵を、切り替えて見比べられます。</p>
      <div class="group-title"><h3>頭の装備</h3><span>3 STYLES</span></div>
      <div class="options">
        <button type="button" class="choice" data-style="base" aria-pressed="false"><span class="thumb"><img src="/src/assets/dress-up/base.png" width="1086" height="1448" alt=""></span><span><span class="name">兜なし</span><span class="description">ポニーテールと基本の装い</span></span><span class="check" aria-hidden="true">✓</span></button>
        <button type="button" class="choice" data-style="silver" aria-pressed="true"><span class="thumb"><img src="/src/assets/dress-up/silver-teal.png" width="1024" height="1536" alt=""></span><span><span class="name">銀・青緑の兜</span><span class="description">銀の面頬と、大きな飾り毛</span></span><span class="check" aria-hidden="true">✓</span></button>
        <button type="button" class="choice" data-style="purple" aria-pressed="false"><span class="thumb"><img src="/src/assets/dress-up/black-gold-purple.png" width="1024" height="1536" alt=""></span><span><span class="name">黒金・紫の兜</span><span class="description">金の縁飾りと、白い仮面</span></span><span class="check" aria-hidden="true">✓</span></button>
      </div>
      <div class="selected"><p>現在の装い</p><h3 id="selected-name">銀・青緑の兜</h3><div id="selected-detail">目穴から顔がのぞく、銀色の兜。</div></div>
      <div class="actions"><button id="remove" type="button">兜を外す</button><a id="download" href="/src/assets/dress-up/silver-teal.png" download="gladiator-chibi-silver.png" aria-disabled="true">この立ち絵を保存 ↓</a></div>
      <p class="note">3枚の全身画像を切り替える見本です。兜パーツの合成は行っていません。</p>
    </section>
  </div>
  <footer><span>GLADIOS / CHIBI APPEARANCE STUDY</span><span>静止画の着せ替え見本</span></footer>
</main>
<script type="module" src="/src/dress-up.ts"></script>
</body>
</html>
